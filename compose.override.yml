# Development overrides, loaded automatically by `docker compose`.
x-dev-build: &dev-build
  build:
    args:
      INSTALL_DEV: "true"

# `--watch`: code edits sync into the containers and uvicorn reloads;
# dependency or Dockerfile changes trigger a rebuild.
x-dev-watch: &dev-watch
  watch:
    - action: sync
      path: .
      target: /app
      ignore:
        - .git/
        - .env
        - .venv/
        - __pycache__/
        - .pytest_cache/
        - .mypy_cache/
        - .ruff_cache/
    - action: rebuild
      path: requirements.txt
    - action: rebuild
      path: requirements-dev.txt
    - action: rebuild
      path: Dockerfile

services:
  ollama:
    ports:
      - "11435:11434"   # host 11434 is used by the native Ollama app

  mysql:
    ports:
      - "3308:3306"     # 3306/3307 are already taken on the host

  migrate:
    <<: *dev-build
    # Dev also loads idempotent demo data
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.seed"]

  tenant-mcp:
    <<: *dev-build
    ports:
      - "8001:8001"     # for external MCP clients (Claude Code/Desktop, IDEs) in dev
    command: ["uvicorn", "app.mcp_server.server:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    develop: *dev-watch

  neo4j:
    ports:
      - "7475:7474"     # Neo4j Browser (host 7474 may be in use)
      - "7688:7687"

  rabbitmq:
    ports:
      - "15673:15672"   # management UI (host 15672 is in use)

  outbox-relay:
    <<: *dev-build
    develop: *dev-watch

  graph-sync:
    <<: *dev-build
    develop: *dev-watch

  graph-mcp:
    <<: *dev-build
    ports:
      - "8002:8002"     # for external MCP clients in dev
    command: ["uvicorn", "app.graph_mcp.server:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    develop: *dev-watch

  app:
    <<: *dev-build
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    develop: *dev-watch

networks:
  # dev only: lets the host reach MySQL (3308), Neo4j (7475/7688) and RabbitMQ's UI (15673)
  data:
    internal: false
  graph:
    internal: false
  broker:
    internal: false
