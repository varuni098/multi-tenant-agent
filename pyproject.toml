[project]
name = "multi-tenant-agent"
version = "0.2.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "agent_ui", "tests"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "ui"]
addopts = "-q"
markers = [
    "isolation: tenant isolation, role escalation and injection suite (merge-blocking)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/seed.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75 # unit tests alone; graph and knowledge code is covered by the integration profile
