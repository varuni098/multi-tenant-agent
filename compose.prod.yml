# Production overrides: docker compose -f compose.yml -f compose.prod.yml up -d --build
# No dev ports, no reload, restart on failure, resource limits, real secrets required.
services:
  ollama:
    restart: unless-stopped

  mysql:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g

  redis:
    restart: unless-stopped

  tenant-mcp:
    restart: unless-stopped
    environment:
      APP_ENV: prod
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (or JWT_JWKS_URL) for production}
      MCP_CONTEXT_SECRET: ${MCP_CONTEXT_SECRET:?Set MCP_CONTEXT_SECRET for production}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  app:
    restart: unless-stopped
    environment:
      APP_ENV: prod
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (or JWT_JWKS_URL) for production}
      MCP_CONTEXT_SECRET: ${MCP_CONTEXT_SECRET:?Set MCP_CONTEXT_SECRET for production}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
