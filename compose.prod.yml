# Production overrides: docker compose -f compose.yml -f compose.prod.yml up -d --build
# No dev ports, no reload, restart on failure, resource limits, real secrets required.
services:
  ollama:
    restart: unless-stopped

  mysql:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g

  redis:
    restart: unless-stopped

  neo4j:
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD for production}

  rabbitmq:
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD for production}

  outbox-relay:
    restart: unless-stopped

  graph-sync:
    restart: unless-stopped
    environment:
      APP_ENV: prod

  knowledge:
    restart: unless-stopped
    volumes:
      - ./docs:/app/docs:ro # update docs without rebuilding

  graph-mcp:
    restart: unless-stopped
    environment:
      APP_ENV: prod
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (or JWT_JWKS_URL) for production}
      MCP_CONTEXT_SECRET: ${MCP_CONTEXT_SECRET:?Set MCP_CONTEXT_SECRET for production}

  tenant-mcp:
    restart: unless-stopped
    environment:
      APP_ENV: prod
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (or JWT_JWKS_URL) for production}
      MCP_CONTEXT_SECRET: ${MCP_CONTEXT_SECRET:?Set MCP_CONTEXT_SECRET for production}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  app:
    restart: unless-stopped
    environment:
      APP_ENV: prod
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (or JWT_JWKS_URL) for production}
      MCP_CONTEXT_SECRET: ${MCP_CONTEXT_SECRET:?Set MCP_CONTEXT_SECRET for production}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
